<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="gymGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background App Tile -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="120" stroke="rgba(16, 185, 129, 0.25)" stroke-width="4" />

  <!-- Iconic Athletic Dumbbell Workout Logo -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)" filter="url(#neon)">
    <!-- Dumbbell Central Bar -->
    <rect x="190" y="238" width="132" height="36" rx="8" fill="url(#gymGlow)" />
    
    <!-- Grip Knurling Lines -->
    <line x1="236" y1="238" x2="236" y2="274" stroke="#ffffff" stroke-width="3" opacity="0.6" />
    <line x1="256" y1="238" x2="256" y2="274" stroke="#ffffff" stroke-width="3" opacity="0.6" />
    <line x1="276" y1="238" x2="276" y2="274" stroke="#ffffff" stroke-width="3" opacity="0.6" />

    <!-- Left Inner Weight Plate Collar -->
    <rect x="170" y="212" width="22" height="88" rx="8" fill="#10b981" />
    <!-- Left Inner Big Plate -->
    <rect x="132" y="172" width="34" height="168" rx="14" fill="url(#gymGlow)" />
    <!-- Left Outer Plate -->
    <rect x="94" y="196" width="34" height="120" rx="12" fill="url(#gymGlow)" opacity="0.9" />

    <!-- Right Inner Weight Plate Collar -->
    <rect x="320" y="212" width="22" height="88" rx="8" fill="#06b6d4" />
    <!-- Right Inner Big Plate -->
    <rect x="346" y="172" width="34" height="168" rx="14" fill="url(#gymGlow)" />
    <!-- Right Outer Plate -->
    <rect x="384" y="196" width="34" height="120" rx="12" fill="url(#gymGlow)" opacity="0.9" />

    <!-- Center Pulse Flare -->
    <circle cx="256" cy="256" r="10" fill="#ffffff" />
  </g>
</svg>